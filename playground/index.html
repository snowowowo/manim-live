<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 内联空图标：不然浏览器会去要 /favicon.ico，控制台平白多一条 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%237ee787' stroke-width='2'/%3E%3C/svg%3E" />
    <title>manim-live · playground</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: #16161a;
        color: #e8e8ea;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }
      h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
      p.sub { margin: 0 0 20px; color: #9a9aa2; font-size: 13px; }
      section { max-width: 1360px; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      button, select {
        background: #26262c; color: #e8e8ea; border: 1px solid #38383f;
        border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
      }
      button:hover { background: #303039; }
      button:disabled { opacity: .5; cursor: default; }
      .stage {
        position: relative; aspect-ratio: 16 / 9; width: 100%;
        border: 1px solid #2c2c33; border-radius: 12px; overflow: hidden; background: #1c1c1c;
      }
      .status { margin-top: 10px; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: #9a9aa2; min-height: 1.6em; white-space: pre-wrap; }
      .status.error { color: #ff7b72; }
      .status.ok { color: #7ee787; }
      textarea {
        width: 100%; min-height: 160px; margin-top: 12px; padding: 12px;
        background: #1b1b20; color: #e8e8ea; border: 1px solid #2c2c33; border-radius: 10px;
        font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; line-height: 1.55; resize: vertical;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>manim-live · playground</h1>
      <p class="sub">
        零框架验证台：真浏览器里跑真 Python + 真 manim-web。这一页不依赖任何框架、不依赖任何宿主。
      </p>

      <div class="toolbar">
        <select id="example" aria-label="选一条内置语料"></select>
        <button id="render" disabled>渲染</button>
        <button id="fast" disabled>极速落终态</button>
        <button id="export" disabled>导出（录屏）</button>
        <span id="warm" class="status" style="margin: 0"></span>
      </div>

      <div class="stage" id="stage"></div>
      <div class="status" id="status">正在准备…（第一次要下 Pyodide，约 20 MB）</div>
      <textarea id="code" spellcheck="false"></textarea>
    </section>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
