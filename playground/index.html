<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 内联空图标：不然浏览器会去要 /favicon.ico，控制台平白多一条 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%237ee787' stroke-width='2'/%3E%3C/svg%3E" />
    <title>manim-live · playground</title>
  </head>
  <body>
    <!--
      只有挂载点：页面本体（含烟测要认的 #status / #render / #stage）全由 React 渲染。
      `class="dark"` 是主题开关——亮/暗两套 token 在 index.css 里按这个类切换，
      main.tsx 启动时会照 localStorage 覆盖它（免得先闪一下暗色再跳亮色）。
    -->
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
